name: Build

on:
  push:
    branches: [development, main]
    tags: ['v*']
  pull_request:

# Read-only unless a job asks for more (the release job writes releases).
permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
      # The image's Flatpak installation on a volume, which Docker fills from the
      # image: updating the SDK renames folders from the image's own layer, which
      # overlayfs refuses on some runners ("Invalid cross-device link").
      volumes:
        - /var/lib/flatpak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the Flatpak (with Odin, mpv and streamlink) and runs the tests.
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          manifest-path: packaging/flatpak/io.github.sp1r17.Lurker.yml
          bundle: lurker.flatpak
          run-tests: true
          cache-key: flatpak-builder-${{ github.sha }}

  # The Flatpak repository on GitHub Pages, made from the bundle on every run so
  # it's tested, and deployed from version tags (the pages job).
  flatpak-repo:
    name: Flatpak repository
    needs: flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lurker-x86_64.flatpak
      - name: Build and sign the repository
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          packaging/flatpak/publish-repo.sh lurker.flatpak "$key" site lurker-repo.flatpak
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      # The bundle released: it installs from the repository, so it gets updates.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lurker-flatpak-release
          path: lurker-repo.flatpak

  pages:
    name: Publish the Flatpak repository
    needs: flatpak-repo
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # lib.exe, dumpbin.exe and the linker, for build.ps1 and Odin.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install Odin and Inno Setup
        run: |
          Invoke-WebRequest https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-windows-amd64-dev-2026-10.zip -OutFile odin.zip
          Expand-Archive odin.zip "$env:RUNNER_TEMP\odin"
          (Get-ChildItem "$env:RUNNER_TEMP\odin" -Recurse -Filter odin.exe)[0].DirectoryName >> $env:GITHUB_PATH
          choco install innosetup -y --no-progress
      - name: Build
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "dev" }
          packaging\windows\build.ps1 -Version $version
      - name: Test
        run: |
          # The tests load the same DLLs as the app.
          $env:PATH = "$PWD\build\windows\dist;$env:PATH"
          odin test src "-extra-linker-flags:/LIBPATH:$PWD\build\windows\deps\mpv"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lurker-windows-setup
          path: build/windows/lurker-*-setup.exe

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Odin and the libraries
        run: |
          brew install sdl3 sdl3_image mpv curl dylibbundler
          curl -sSfL https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-macos-arm64-dev-2026-10.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP"/odin-macos-arm64-* >> "$GITHUB_PATH"
      - name: Test
        run: ./build.sh test
      - name: Build
        run: |
          version=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          packaging/macos/build.sh "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lurker-macos-dmg
          path: build/macos/lurker-*-arm64.dmg

  # A version tag (v1.2.3) publishes its Flatpak, Windows installer and macOS disk
  # image on a GitHub release, once the Flatpak repository has it.
  release:
    name: Release
    needs: [pages, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Holds UPDATE_SIGNING_KEY, available only to version tags.
    environment: release
    permissions:
      contents: write
    steps:
      # For the public key Lurker checks updates with (src/update.odin).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lurker-flatpak-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lurker-windows-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lurker-macos-dmg
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          flatpak="lurker-${TAG#v}-x86_64.flatpak"
          mv lurker-repo.flatpak "$flatpak"
          setup="lurker-${TAG#v}-x86_64-setup.exe"
          # Lurker checks the installer against this before it updates itself.
          dmg="lurker-${TAG#v}-arm64.dmg"
          sha256sum "$flatpak" "$setup" "$dmg" > SHA256SUMS
          # Signed, as Lurker on Windows won't install an update without it: the
          # key must be the one whose public half is UPDATE_PUBLIC_KEY.
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "UPDATE_SIGNING_KEY isn't set in the release environment"
            exit 1
          fi
          key="$RUNNER_TEMP/update-key.pem"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
          public=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          expected=$(sed -n 's/^UPDATE_PUBLIC_KEY :: "\([0-9a-f]*\)"$/\1/p' source/src/update.odin)
          if [ "$public" != "$expected" ]; then
            echo "The signing key's public key ($public) isn't UPDATE_PUBLIC_KEY ($expected)"
            exit 1
          fi
          openssl pkeyutl -sign -rawin -inkey "$key" -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$key"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$flatpak" "$setup" "$dmg" SHA256SUMS SHA256SUMS.sig --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$flatpak" "$setup" "$dmg" SHA256SUMS SHA256SUMS.sig --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Lurker ${TAG#v}" \
              --notes "Linux: \`flatpak install --user https://sp1r17.github.io/lurker/lurker.flatpakref\` (or \`flatpak install --user $flatpak\`), then \`flatpak update\` keeps it updated. Windows: run $setup. macOS (Apple silicon): open $dmg and drag Lurker to Applications."
          fi
